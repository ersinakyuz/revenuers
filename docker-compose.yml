services:
  mysql:
    image: mysql:8.4
    container_name: revenuers-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: revenuers
      MYSQL_USER: revenuers
      MYSQL_PASSWORD: revenuerspass

    ports:
      - "3306:3306"

    volumes:
      - revenuers_mysql_data:/var/lib/mysql

volumes:
  revenuers_mysql_data:
